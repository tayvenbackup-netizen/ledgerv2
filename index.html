<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger Mobile Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .simulator-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .simulator-label {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 50px;
            padding: 12px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 0 2px #333;
            position: relative;
        }
        .phone-notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 38px;
            overflow: hidden;
            background: #000;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .phone-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            z-index: 10;
        }
        .resize-hint {
            color: #8e8e93;
            font-size: 13px;
            margin-top: 8px;
        }
        @media (max-width: 420px) {
            .phone-frame {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                padding: 0;
            }
            .phone-screen {
                border-radius: 0;
            }
            .phone-notch, .phone-button {
                display: none;
            }
        }
        @media (max-height: 900px) {
            .phone-frame {
                transform: scale(0.85);
            }
        }
        @media (max-height: 750px) {
            .phone-frame {
                transform: scale(0.75);
            }
        }
        @media (max-height: 650px) {
            .phone-frame {
                transform: scale(0.65);
            }
        }
    </style>
</head>
<body>
    <div class="simulator-wrapper">
        <div class="simulator-label">Ledger Mobile Simulator</div>
        <div class="phone-frame">
            <div class="phone-notch"></div>
            <div class="phone-screen">
                <iframe src="./v2/" allow="fullscreen"></iframe>
            </div>
            <div class="phone-button"></div>
        </div>
        <div class="resize-hint">Resize your browser window to simulate different screen sizes</div>
    </div>
</body>
</html>
